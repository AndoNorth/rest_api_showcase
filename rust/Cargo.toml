[package]
name = "rust_rest_api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }

axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "mysql",
    "macros"
] }

tracing = "0.1"
tracing-subscriber = "0.3"

